name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and the Claude Code CLI
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          npm install -g @anthropic-ai/claude-code || echo "claude CLI not installed; plugin validate will be skipped"
      - name: Run all checks
        run: ./scripts/ci.sh
