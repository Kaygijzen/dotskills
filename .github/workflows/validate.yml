name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: ./scripts/validate.sh
      - name: Check manifests are valid JSON
        run: |
          jq empty .claude-plugin/marketplace.json
          jq empty .claude-plugin/plugin.json
